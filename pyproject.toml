[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "hailmary-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncmy>=0.2.9",
    "greenlet>=3.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "certifi>=2024.7.4",
    "aiohttp>=3.9.0",
    "boto3>=1.35.0",
    "redis>=5.0.0",
    "pyjwt>=2.9.0",
    "portone-server-sdk>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI는 Depends/Body/Query 등을 default 인자로 사용하는 표준 패턴
# UP042: SQLAlchemy Enum 매핑 호환을 위해 str+Enum 다중상속이 필요
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

# botocore 는 PyPI 타입 stub 없음 (boto3-stubs는 boto3 표면만 커버). 직접 import 만 ignore.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

# portone-server-sdk 는 동적 생성 모듈(payment/webhook 서브모듈)이라 mypy가 추적 불가.
[[tool.mypy.overrides]]
module = ["portone_server_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
